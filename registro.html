<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Lyra Music</title>
    <link rel="stylesheet" href="/lyra.css">
</head>
<body class="body-auth">

    <div class="view-container auth-container">
        <div class="view-header auth-header">
            <div class="lyra-nav-title auth-title">🎵 Lyra Music</div>
            <div class="view-description">Crea una cuenta nueva para tus canciones</div>
        </div>

        <form onsubmit="registrar(event)">
            <div class="form-group">
                <label class="form-label" for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" class="form-input" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" class="form-input" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="clave">Contraseña:</label>
                <input type="password" id="clave" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit auth-btn-submit">Registrarme</button>
        </form>

        <p id="aviso" class="auth-aviso"></p>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login" class="auth-link-alt">Inicia sesión aquí</a>
            <br><br>
            <a href="/catalogo" class="auth-link-back">← Volver al Catálogo</a>
        </div>
    </div>

    <script>
        async function registrar(e) {
            e.preventDefault();
            let n = document.getElementById("nombre").value;
            let c = document.getElementById("correo").value;
            let p = document.getElementById("clave").value;
            let aviso = document.getElementById("aviso");

            let res = await fetch("/api/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: n, correo: c, contraseña: p })
            });

            let datos = await res.json();
            if (datos.status === "ok") {
                aviso.style.color = "var(--accent-glow)";
                aviso.innerText = "✔ Cuenta creada con éxito. Redirigiendo...";
                setTimeout(() => { window.location.href = "/login"; }, 1000);
            } else {
                aviso.style.color = "#f87171";
                aviso.innerText = datos.mensaje || "Error al registrarse.";
            }
        }
    </script>
</body>
</html>
