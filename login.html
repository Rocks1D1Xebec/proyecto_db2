<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Lyra Music</title>
    <link rel="stylesheet" href="/lyra.css">
</head>
<body class="body-auth">

    <div class="view-container auth-container">
        <div class="view-header auth-header">
            <div class="lyra-nav-title auth-title">🎵 Lyra Music</div>
            <div class="view-description">Ingresa a tu cuenta para gestionar listas y likes</div>
        </div>

        <form onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label class="form-label" for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" class="form-input" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="clave">Contraseña:</label>
                <input type="password" id="clave" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit auth-btn-submit">Iniciar Sesión</button>
        </form>

        <p id="aviso" class="auth-aviso"></p>

        <div class="auth-footer">
            ¿No tienes cuenta? <a href="/registro" class="auth-link-alt">Regístrate aquí</a>
            <br><br>
            <a href="/catalogo" class="auth-link-back">← Volver al Catálogo</a>
        </div>
    </div>

    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            let c = document.getElementById("correo").value;
            let p = document.getElementById("clave").value;
            let aviso = document.getElementById("aviso");

            let res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ correo: c, contraseña: p })
            });

            let datos = await res.json();
            if (datos.status === "ok") {
                localStorage.setItem("usuario", JSON.stringify(datos.usuario));
                document.cookie = "usuario_id=" + datos.usuario.id + "; path=/; max-age=31536000";
                window.location.href = "/catalogo?u=" + datos.usuario.id;
            } else {
                aviso.innerText = datos.mensaje || "Credenciales incorrectas.";
            }
        }
    </script>
</body>
</html>
